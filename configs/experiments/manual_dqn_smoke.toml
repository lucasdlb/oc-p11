[run]
name = "manual_dqn_smoke"
seed = 42

[agent]
type = "manual_dqn"

[includes]
env = "default"
evaluation = "quick"
video = "quick"
paths = "default"

[train]
total_timesteps = 20

[algorithm]
learning_rate = 0.0003
replay_size = 100
learning_starts = 10
batch_size = 8
gamma = 0.99
eps_start = 0.9
eps_end = 0.01
eps_decay = 25000
tau = 0.005
train_freq = 1
gradient_clip = 100.0
net_arch = [16]
log_interval = 1
