[run]
name = "sb3_dqn_smoke"
seed = 42

[agent]
type = "sb3_dqn"

[includes]
env = "default"
evaluation = "quick"
video = "quick"
paths = "default"

[train]
total_timesteps = 20

[algorithm]
learning_rate = 0.0001
buffer_size = 100
learning_starts = 10
batch_size = 8
gamma = 0.99
train_freq = 4
gradient_steps = 1
target_update_interval = 100
exploration_fraction = 0.2
exploration_initial_eps = 1.0
exploration_final_eps = 0.05
net_arch = [16]
verbose = 0
